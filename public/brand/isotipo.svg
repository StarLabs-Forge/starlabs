<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-label="StarLabs">
  <defs>
    <linearGradient id="sl-mark-fill" x1="8%" y1="92%" x2="92%" y2="8%">
      <stop offset="0%" stop-color="#20D9FF"/>
      <stop offset="38%" stop-color="#287BFF"/>
      <stop offset="68%" stop-color="#7657FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="sl-mark-ribbon" x1="0%" y1="0%" x2="20%" y2="100%">
