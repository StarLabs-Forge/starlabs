  <!-- cola en S: remate de la estrella, doble lectura con la inicial de "Labs" -->
  <path d="M118 150 C128 140,130 122,116 118 C104 115,96 122,100 132 C104 142,116 138,112 126 C108 116,92 112,80 122 C68 132,70 150,84 158"
