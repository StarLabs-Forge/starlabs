  <polygon points="24,164 146,44 158,50 36,170" fill="#F5F7FF" opacity="0.35" style="mix-blend-mode:screen"/>
  <path d="M152 28 C153.4 34 155 35.6 161 37 C155 38.4 153.4 40 152 46 C150.6 40 149 38.4 143 37 C149 35.6 150.6 34 152 28 Z" fill="#EAF6FF"/>
